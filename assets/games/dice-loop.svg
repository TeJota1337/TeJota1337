<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="312" viewBox="0 0 320 312">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39D353"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="cover"><rect x="12" y="12" width="296" height="235" rx="12"/></clipPath>
  </defs>
  <rect x="1" y="1" width="318" height="310" rx="20" fill="#0D1117" stroke="url(#border)" stroke-width="2"/>
  <g clip-path="url(#cover)">
    <!-- blurred copy fills the frame, the sharp cover sits on top uncropped -->
    <image x="-8" y="-8" width="336" height="275" preserveAspectRatio="xMidYMid slice" filter="url(#blur)" opacity="0.55" xlink:href="data:image/png;base64,"/>
    <image x="12" y="12" width="296" height="235" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,"/>
  </g>
  <text x="16" y="277" fill="#F0F6FC" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">Dice Loop</text>
  <text x="16" y="299" fill="#39D353" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">▶ Play on itch.io</text>
</svg>
